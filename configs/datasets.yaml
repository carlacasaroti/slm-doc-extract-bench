# Dataset registry — multi-domain document extraction
#
# Each dataset maps to a `task` defined in configs/tasks.yaml, which in turn
# defines the target JSON schema the extractor must fill in.
#
# `loader` points to the module in src/slmbench/datasets/loaders that knows
# how to parse that specific dataset's raw format into the common
# `DocumentSample` structure (see src/slmbench/datasets/base.py).
#
# License/access notes are included because some of these require manual
# registration (e.g. via RRC / Kaggle) before the download script can pull
# them — see docs/ADDING_A_DATASET.md and scripts/download_datasets.py.

datasets:
  - id: sroie2019
    domain: receipts
    task: receipt_key_info
    loader: sroie
    source: https://rrc.cvc.uab.es/?ch=13
    license: research-use (registration required)
    n_samples: ~1000
    notes: Classic receipt KIE benchmark — company, date, address, total.

  - id: cord
    domain: receipts
    task: receipt_line_items
    loader: cord
    source: https://github.com/clovaai/cord
    license: CC BY 4.0
    n_samples: ~1000
    notes: Indonesian receipts with full line-item + totals structure.

  - id: funsd
    domain: forms
    task: form_key_value
    loader: funsd
    source: https://guillaumejaume.github.io/FUNSD/
    license: research-use
    n_samples: 199
    notes: Noisy scanned forms, key-value + entity linking.

  - id: xfund
    domain: forms
    task: form_key_value
    loader: xfund
    source: https://github.com/doc-analysis/XFUND
    license: CC BY-NC-SA 4.0
    n_samples: ~1900 (7 languages)
    notes: Multilingual forms — useful if you want PT/other-language coverage.

  - id: docile
    domain: invoices
    task: invoice_fields
    loader: docile
    source: https://github.com/rossumai/docile
    license: research-use (registration required)
    n_samples: ~6700 annotated + 100k+ unlabeled
    notes: Large, realistic invoice IE benchmark, closest to production data.

  - id: docvqa
    domain: general
    task: document_qa
    loader: docvqa
    source: https://www.docvqa.org/
    license: research-use
    n_samples: ~12000 images / ~50000 QA pairs
    notes: >
      Question-answering rather than fixed-schema extraction — used here to
      test general document comprehension, not just field extraction.

  - id: kleister_nda
    domain: contracts
    task: contract_entities
    loader: kleister
    source: https://github.com/applicaai/kleister-nda
    license: CC BY 4.0
    n_samples: ~540
    notes: Long documents (NDAs) — good stress test for context length.

  - id: synthetic_invoices_ptbr
    domain: invoices
    task: invoice_fields
    loader: synthetic
    generated: true
    source: generated locally via scripts/generate_synthetic_docs.py
    license: n/a (generated)
    n_samples: configurable
    notes: >
      Templated PT-BR invoices/receipts with known ground truth — useful for
      controlled ablations (rotation, noise, font, layout perturbations)
      without depending on external downloads.

  - id: synthetic_invoices_ptbr_reduced
    domain: invoices
    task: invoice_fields_reduced
    loader: synthetic
    generated: true
    source: generated locally via scripts/generate_synthetic_docs.py
    license: n/a (generated)
    n_samples: configurable
    notes: >
      SAME underlying documents as synthetic_invoices_ptbr (same rng seed),
      but only 5 fields are requested. Compare results against
      synthetic_invoices_ptbr to isolate "model drops these fields because
      they're hard" vs. "model drops them because 10 fields is too many at
      once" — see docs/ARCHITECTURE.md#controlled-experiments.

  # --- Field-count degradation curve (see configs/tasks.yaml for the
  # fixed nested field order) — same documents, 2/4/6/8 fields requested.
  - id: synthetic_invoices_ptbr_2f
    domain: invoices
    task: invoice_fields_2
    loader: synthetic
    generated: true
    source: generated locally
    license: n/a (generated)
    n_samples: configurable
    notes: Field-count curve, point 1/5 (2 fields). Same documents as synthetic_invoices_ptbr.

  - id: synthetic_invoices_ptbr_4f
    domain: invoices
    task: invoice_fields_4
    loader: synthetic
    generated: true
    source: generated locally
    license: n/a (generated)
    n_samples: configurable
    notes: Field-count curve, point 2/5 (4 fields). Same documents as synthetic_invoices_ptbr.

  - id: synthetic_invoices_ptbr_6f
    domain: invoices
    task: invoice_fields_6
    loader: synthetic
    generated: true
    source: generated locally
    license: n/a (generated)
    n_samples: configurable
    notes: Field-count curve, point 3/5 (6 fields). Same documents as synthetic_invoices_ptbr.

  - id: synthetic_invoices_ptbr_8f
    domain: invoices
    task: invoice_fields_8
    loader: synthetic
    generated: true
    source: generated locally
    license: n/a (generated)
    n_samples: configurable
    notes: Field-count curve, point 4/5 (8 fields). Same documents as synthetic_invoices_ptbr.

  - id: real_waste_invoices
    domain: invoices
    task: waste_invoice_fields
    loader: real_pdf
    source: local PDFs in data/raw/real_waste_invoices/
    license: proprietary (do not redistribute)
    n_samples: 2
    notes: Real US waste-management invoices (PDF), page 1 rasterized to PNG.

  - id: real_waste_invoices_2f
    domain: invoices
    task: waste_invoice_fields_2
    loader: real_pdf
    source: symlink to data/raw/real_waste_invoices/
    license: proprietary (do not redistribute)
    n_samples: 2
    notes: Field-count curve on real invoices — 2 fields.

  - id: real_waste_invoices_4f
    domain: invoices
    task: waste_invoice_fields_4
    loader: real_pdf
    source: symlink to data/raw/real_waste_invoices/
    license: proprietary (do not redistribute)
    n_samples: 2
    notes: Field-count curve on real invoices — 4 fields.

  - id: real_waste_invoices_6f
    domain: invoices
    task: waste_invoice_fields_6
    loader: real_pdf
    source: symlink to data/raw/real_waste_invoices/
    license: proprietary (do not redistribute)
    n_samples: 2
    notes: Field-count curve on real invoices — 6 fields.

  - id: real_waste_invoices_7f
    domain: invoices
    task: waste_invoice_fields_7
    loader: real_pdf
    source: symlink to data/raw/real_waste_invoices/
    license: proprietary (do not redistribute)
    n_samples: 2
    notes: Field-count curve on real invoices — 7 fields (all scalars).

  - id: real_waste_invoices_5f
