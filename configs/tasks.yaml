# Extraction tasks — one JSON Schema per document domain.
#
# These schemas are used in three places:
#   1. Injected into the prompt (models/*/prompt templates) so the model
#      knows exactly which fields to return.
#   2. Used for structured-decoding / grammar-constrained generation where
#      the backend supports it (e.g. Ollama's `format: json_schema`,
#      transformers + outlines/guidance).
#   3. Used by the evaluator to align predicted vs. ground-truth fields.

tasks:
  receipt_key_info:
    description: Extract header-level key information from a receipt.
    schema:
      type: object
      properties:
        company_name: { type: string }
        address: { type: string }
        date: { type: string, description: "ISO 8601 if determinable, else as printed" }
        total: { type: number }
      required: [company_name, date, total]

  receipt_line_items:
    description: Extract header info plus itemized line items from a receipt.
    schema:
      type: object
      properties:
        store_name: { type: string }
        date: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: number }
              unit_price: { type: number }
              total_price: { type: number }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
      required: [items, total]

  form_key_value:
    description: Extract all key-value pairs present in a structured form.
    schema:
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
      required: [fields]

  invoice_fields:
    description: >
      Extract standard invoice header, party, and totals fields. For
      `currency`, normalize whatever symbol or code appears on the document
      to its ISO 4217 code (e.g. "R$" -> "BRL", "$" -> "USD", "€" -> "EUR").
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        issue_date: { type: string }
        due_date: { type: string }
        vendor_name: { type: string }
        vendor_tax_id: { type: string }
        customer_name: { type: string }
        currency: { type: string }
        subtotal: { type: number }
        tax_amount: { type: number }
        total_amount: { type: number }
      required: [invoice_number, vendor_name, total_amount]

  invoice_fields_reduced:
    description: >
      Extract ONLY these 5 fields from the invoice — do not return any other
      field. This is a controlled-experiment variant of `invoice_fields`,
      used to test whether small models drop these specific fields because
      they're genuinely hard to extract, or because they get deprioritized
      when competing with 5 other fields in the same schema.
    schema:
      type: object
      properties:
        issue_date: { type: string }
        vendor_tax_id: { type: string }
        customer_name: { type: string }
        subtotal: { type: number }
        tax_amount: { type: number }
      required: [issue_date, vendor_tax_id, customer_name, subtotal, tax_amount]

  # --- Field-count degradation curve -----------------------------------
  # invoice_fields_2 / _4 / _6 / _8, plus the full invoice_fields (10)
  # above, form a NESTED sequence over a fixed field order (interleaving
  # known-easy and known-hard fields so hard fields aren't all clustered
  # at the end):
  #
  #   1. invoice_number   (easy)   6. customer_name  (hard)
  #   2. issue_date       (hard)   7. currency       (easy)
  #   3. vendor_name      (easy)   8. subtotal       (hard)
  #   4. vendor_tax_id    (hard)   9. due_date       (easy)
  #   5. total_amount     (easy)  10. tax_amount      (hard)
  #
  # Every field in invoice_fields_2 is also in invoice_fields_4, which is
  # also in invoice_fields_6, etc. — so growing the schema only ever ADDS
  # fields, never swaps which ones, isolating "field count" from "which
  # specific fields" as cleanly as a fixed order allows. See
  # docs/ARCHITECTURE.md#controlled-experiments.
  #
  # NOTE: invoice_fields_reduced (above) is a DIFFERENT selection (the 5
  # hardest fields specifically) — don't treat it as part of this nested
  # sequence when plotting the degradation curve.

  invoice_fields_2:
    description: >
      Extract ONLY these 2 fields from the invoice — do not return any
      other field: invoice_number, issue_date.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        issue_date: { type: string }
      required: [invoice_number, issue_date]

  invoice_fields_4:
    description: >
      Extract ONLY these 4 fields from the invoice — do not return any
      other field: invoice_number, issue_date, vendor_name, vendor_tax_id.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        issue_date: { type: string }
        vendor_name: { type: string }
        vendor_tax_id: { type: string }
      required: [invoice_number, issue_date, vendor_name, vendor_tax_id]

  invoice_fields_6:
    description: >
      Extract ONLY these 6 fields from the invoice — do not return any
      other field: invoice_number, issue_date, vendor_name, vendor_tax_id,
      total_amount, customer_name.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        issue_date: { type: string }
        vendor_name: { type: string }
        vendor_tax_id: { type: string }
        total_amount: { type: number }
        customer_name: { type: string }
      required: [invoice_number, issue_date, vendor_name, vendor_tax_id, total_amount, customer_name]

  invoice_fields_8:
    description: >
      Extract ONLY these 8 fields from the invoice — do not return any
      other field: invoice_number, issue_date, vendor_name, vendor_tax_id,
      total_amount, customer_name, currency, subtotal.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        issue_date: { type: string }
        vendor_name: { type: string }
        vendor_tax_id: { type: string }
        total_amount: { type: number }
        customer_name: { type: string }
        currency: { type: string }
        subtotal: { type: number }
      required: [invoice_number, issue_date, vendor_name, vendor_tax_id, total_amount, customer_name, currency, subtotal]

  contract_entities:
    description: Extract key named entities from a legal contract (e.g. NDA).
    schema:
      type: object
      properties:
        party_1: { type: string }
        party_2: { type: string }
        effective_date: { type: string }
        term_length: { type: string }
        governing_law: { type: string }
        jurisdiction: { type: string }
      required: [party_1, party_2, effective_date]

  document_qa:
    description: Free-form question answering grounded in the document.
    schema:
      type: object
      properties:
        answer: { type: string }
      required: [answer]

  waste_invoice_fields:
    description: >
      Extract header, totals and the line-item table from a waste-management
      invoice. vendor_name is the hauler/company issuing the invoice and
      receiving payment; customer_name is the party being billed. product_dates
      and product_descriptions are the per-row Date and Description columns of
      the line-item table, in the same order they appear.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        date: { type: string, description: "Issue date of the invoice" }
        due_date: { type: string }
        vendor_name: { type: string }
        customer_name: { type: string }
        customer_number: { type: string }
        total_amount: { type: number }
        product_dates:
          type: array
          items: { type: string }
          description: "Table dates related to products in Description"
        product_descriptions:
          type: array
          items: { type: string }
          description: "Product/line-item descriptions from the table"
      required: [invoice_number, vendor_name, total_amount]

  # --- Real waste-invoice field-count curve (same PDFs, growing scalar
  # field set, fixed nested order). Lists (product_*) excluded on purpose:
  # they are uniformly hard and would confound the field-count effect.
  waste_invoice_fields_2:
    description: Extract these fields from a waste-management invoice.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        customer_name: { type: string }
      required: [invoice_number]

  waste_invoice_fields_4:
    description: Extract these fields from a waste-management invoice.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        customer_name: { type: string }
        total_amount: { type: number }
        customer_number: { type: string }
      required: [invoice_number, total_amount]

  waste_invoice_fields_6:
    description: Extract these fields from a waste-management invoice.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        customer_name: { type: string }
        total_amount: { type: number }
        customer_number: { type: string }
        vendor_name: { type: string }
        date: { type: string, description: "Issue date of the invoice" }
      required: [invoice_number, vendor_name, total_amount]

  waste_invoice_fields_7:
    description: Extract these fields from a waste-management invoice.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        customer_name: { type: string }
        total_amount: { type: number }
        customer_number: { type: string }
        vendor_name: { type: string }
        date: { type: string, description: "Issue date of the invoice" }
        due_date: { type: string }
      required: [invoice_number, vendor_name, total_amount]

  waste_invoice_fields_5:
    description: Extract these fields from a waste-management invoice.
    schema:
      type: object
      properties:
        invoice_number: { type: string }
        customer_name: { type: string }
        total_amount: { type: number }
        customer_number: { type: string }
        vendor_name: { type: string }
      required: [invoice_number, vendor_name, total_amount]
